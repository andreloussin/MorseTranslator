name: Build Qt Linux 64-bit

on:
  push:
    tags:
      - 'v*'

jobs:
  build-linux-64bit:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: 1. Checkout du code sur le tag
        uses: actions/checkout@v4

      - name: 2. Installer Qt (version 5.12.12 MinGW 32-bit)
        uses: jurplel/install-qt-action@v3
        with:
          version: '5.12.12'
          arch: 'win32_mingw73'
          tools: 'mingw730_32,tools_cmake'

      - name: 3. Compiler le projet en mode Release (MinGW 32-bit)
        shell: cmd
        run: |
          echo D:\a\MorseTranslator\Qt\Tools\mingw730_32\bin>>%GITHUB_PATH%
          echo D:\a\MorseTranslator\Qt\5.12.12\mingw73_32\bin>>%GITHUB_PATH%
          set PATH=D:\a\MorseTranslator\Qt\Tools\mingw730_32\bin;D:\a\MorseTranslator\Qt\5.12.12\mingw73_32\bin;%PATH%
          where g++
          qmake MorseTranslator.pro -spec win32-g++
          mingw32-make release

      - name: 4. Archiver le binaire en .tar.gz
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          tar -czf "MorseTranslator-${TAG}-linux-x86_64.tar.gz" -C build-linux64 MorseTranslator

      - name: 5. Publier sur GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: MorseTranslator-${{ github.ref_name }}-linux-x86_64.tar.gz